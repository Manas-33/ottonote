[project]
name = "ottonote-backend"
version = "0.1.0"
description = "OttoNote backend — FastAPI service for transcription, diarization, and meeting summarization."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.20",
    "faster-whisper>=1.0.3",
    "pyannote-audio>=4.0",
    "anthropic>=0.40",
    "asyncpg>=0.31.0",
    "sqlalchemy>=2.0.49",
    "alembic>=1.18.4",
    "pyjwt>=2.13.0",
    "greenlet>=3.5.1",
    "cryptography>=48.0.0",
    "celery[redis]>=5.4",
    "supabase>=2.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
